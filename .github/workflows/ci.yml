# VrtićOS CI (technical-architecture.md §7). No deploy job exists until D-3/D-6 are approved.
name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  NEXT_TELEMETRY_DISABLED: '1'
  EXPO_NO_TELEMETRY: '1'
  APP_ENV: test

jobs:
  quality:
    name: lint · typecheck · unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: seed generator is deterministic and committed
        run: pnpm seed:generate && git diff --exit-code -- supabase/seed.sql docs/architecture/demo-accounts.md
      - name: DESIGN.md frontmatter and prototype tokens match packages/tokens
        run: pnpm design:sync && git diff --exit-code -- DESIGN.md design/prototype/tokens.css
      # R-47: Edge Functions are outside ESLint/tsc; Deno checks them with the one canonical config
      # (supabase/functions/deno.json, lockfile frozen). Same Deno version as the local Edge Runtime.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.1.4
      - name: Edge Functions — deno check (types)
        run: pnpm functions:check
      - name: Edge Functions — deno lint
        run: pnpm functions:lint

  db:
    name: database · migrations · RLS · integration · e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: start local Supabase (migrations + synthetic seed applied from zero)
        run: pnpm db:start
      - name: pgTAP — catalog checks (ST-RLS-00) and tenant isolation (NEG tests)
        run: pnpm db:test
      - name: Phase 3 RLS spike
        run: pnpm db:spike
      - name: generated DB types are up to date
        run: pnpm db:types && git diff --exit-code -- packages/db-types/src/database.ts
      - name: integration — e-mail code via Mailpit, TOTP MFA, invitation Edge Functions
        run: pnpm test:integration
      - name: admin build against the local stack (public local keys only)
        run: |
          KEY=$(node scripts/supabase.mjs status -o json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s.slice(s.indexOf('{'))).PUBLISHABLE_KEY))")
          printf 'NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321\nNEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\nNEXT_PUBLIC_APP_ENV=demo\n' "$KEY" > apps/admin/.env.local
          pnpm --filter @vrticos/admin build
      - name: admin e2e — sign-in, MFA, structure, staff, invitations (Playwright)
        run: |
          pnpm --filter @vrticos/integration-tests exec playwright install --with-deps chromium
          (pnpm --filter @vrticos/admin start > admin.log 2>&1 &)
          for i in $(seq 1 60); do curl -fs -o /dev/null http://localhost:3000/sign-in && break; sleep 1; done
          pnpm --filter @vrticos/integration-tests run e2e
      - name: admin server log (on failure)
        if: failure()
        run: cat admin.log || true

  apps:
    name: admin build · mobile bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vrticos/admin build
      - name: export Expo JS bundles (no EAS account needed)
        run: pnpm --filter @vrticos/mobile export
        env:
          EXPO_OFFLINE: '1'
      # supabase-js contains the bare prefix "sb_secret_" (key-format detection) and Hermes packs strings
      # back-to-back, so match a real key body (alphanumeric first character, 16+ chars).
      - name: no secret keys in client bundles (SR-SUP-04)
        run: "! grep -rlaE 'sb_secret_[A-Za-z0-9][A-Za-z0-9_-]{15,}|service_role' apps/mobile/dist apps/admin/.next/static"

  security:
    name: secrets · dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.0 git /repo --redact --no-banner
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: dependency audit (high and critical)
        run: pnpm audit --audit-level high
