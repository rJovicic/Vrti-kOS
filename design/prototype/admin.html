// Interaction demo: tap a tag to move it through expected → present → departed (the fill rises from the base).
document.querySelectorAll('figure.interactive .tag').forEach(function (t) {

    var st = t.querySelector('.state');
    var now = new Date().toLocaleTimeString('hr-HR', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Zagreb' });

});
